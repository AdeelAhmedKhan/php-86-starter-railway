[global]
; Main php-fpm config for this starter. The official Docker image
; ships its own main config, but this starter provides its own so
; the pid file and log stream land where Railway expects them.
; The fpm master runs as the container user (www-data), so the pid
; file lives in /run/nginx, the directory the Dockerfile chowns to
; www-data. Logs go to stderr for Railway's log stream.
pid = /run/nginx/php-fpm.pid
error_log = /dev/stderr
daemonize = yes

include = /usr/local/etc/php-fpm.d/*.conf
