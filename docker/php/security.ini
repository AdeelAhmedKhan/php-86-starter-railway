; PHP security hardening for the PHP 8.6 starter.
; Loaded after the base php.ini (99- prefix), so these override defaults.

; --- Session upload progress RCE (CVE-2026-115560 class) ----------
; A config-dependent RCE via session.upload_progress was patched in
; the 19 Nov 2026 PHP security releases. This starter does not use
; upload-progress tracking at all, so turning it off costs nothing
; and removes the whole class regardless of patch state.
session.upload_progress.enabled = 0

; --- Information disclosure ---------------------------------------
; Never leak the PHP version in response headers.
expose_php = 0

; --- Session hardening --------------------------------------------
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.gc_probability = 1
session.gc_divisor = 100

; --- Upload limits (small on purpose for a starter) ----------------
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

; --- Execution limits ---------------------------------------------
max_execution_time = 30
memory_limit = 256M

; --- Error handling ------------------------------------------------
; Production must never leak stack traces or paths to the browser.
display_errors = 0
display_startup_errors = 0
log_errors = 1
error_log = /dev/stderr
