# nginx for the PHP 8.6 starter (php-fpm, no mod_php).
# This is a TEMPLATE: entrypoint.sh substitutes ${PORT} (Railway
# injects $PORT at runtime; defaults to 8080 locally) and writes the
# real config to /run/nginx/nginx.conf, the one directory the
# non-root runtime user can write (it cannot write /etc/nginx).
#
# Security notes:
# - Only /public is served. The ONLY PHP entry point is index.php;
#   no other .php file is ever executed, and requests for any other
#   .php path return 404.
# - Hidden files (.env, .git, etc.) are never served.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    server {
        listen ${PORT};
        server_name _;
        root /app/public;
        index index.php;

        # Never serve hidden files or anything outside public/.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # The ONLY PHP entry point. Any other .php request is a 404.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }

        location ~ \.php$ {
            return 404;
        }

        # Static assets: cache aggressively, they are fingerprinted.
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
